<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>KUKA TAXI · Админ-панель</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap&subset=cyrillic">
<link rel="stylesheet" href="/styles.css">
<style>
.adm{max-width:1100px;margin:0 auto;padding:16px 16px 60px;display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button.on{background:var(--ink);color:var(--paper)}
.split{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:16px;align-items:start}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.qitem{width:100%;text-align:left;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.qitem[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--yellow)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.photos figure{margin:0;display:flex;flex-direction:column;gap:6px}
.photos img{width:100%;border-radius:12px;border:1px solid var(--line);background:#000;cursor:zoom-in;max-height:360px;object-fit:contain}
.photos figcaption{font-size:13px;font-weight:600}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.big{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:80;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:12px}
.big img{max-width:100%;max-height:100%;object-fit:contain}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/admin.js"></script>
</body>
</html>
